name: Scheduled migration

# Executa a migração do banco do Elos para o coredb uma vez por dia e também à mão.
# O agendamento só roda com a variável RPA_SCHEDULE_ENABLED igual a true, e nada é executado sem os segredos
# ORIGEM_DB_URL e DESTINO_DB_URL. A migração é idempotente pela tabela rpa_id_mapping do destino.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || vars.RPA_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORIGEM_DB_URL: ${{ secrets.ORIGEM_DB_URL }}
      DESTINO_DB_URL: ${{ secrets.DESTINO_DB_URL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      MOCKS_MANIFEST: ${{ github.workspace }}/mocks-warehouse/manifest.json

    steps:
      - name: Check the connection secrets
        id: secrets
        run: |
          if [ -z "$ORIGEM_DB_URL" ] || [ -z "$DESTINO_DB_URL" ]; then
            echo "::warning::ORIGEM_DB_URL e DESTINO_DB_URL não estão configurados; a migração não foi executada."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Check out the image manifest
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: Solierrr/mocks-warehouse
          path: mocks-warehouse
          sparse-checkout: manifest.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: python -m pip install -r requirements.txt

      - name: Run the migration
        if: steps.secrets.outputs.ready == 'true'
        run: python main.py

      - name: Upload the log
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rpa-etl-log
          path: rpa_etl.log
          if-no-files-found: ignore
          retention-days: 14
